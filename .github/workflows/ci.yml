name: LuoguSP CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: luogusp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ★ 这里**不能用 setup-node 的 `cache: npm`**。那个开关会在装完 Node 后立刻
      #   调一次 npm 去定位缓存目录，而那次调用用的是镜像自带的 npm 11.19.0，
      #   会当场撞上 package.json 里 `devEngines.packageManager: ^12` 而 EBADDEVENGINES
      #   ——「Set up Node」这一步直接失败，后面全被跳过（2026-08-15 实际发生过）。
      #   缓存改为下面显式声明，键仍绑 package-lock.json。
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # 开发机的 npm 由 pnpm 全局装（`pnpm add -g npm`）而非跟随 Node —— pnpm 11 起
      # 安装 Node 运行时**不解包自带的 npm**，两者是解耦的。Node 26.7.0 自带 11.19.0，
      # 本地是 12.x，而 lock 同步门（scripts/lock-sync.mjs）跑的正是 `npm ci`，
      # 它存在的意义就是「本地先红、别让 CI 红」—— 两边 npm 大版本不同这道门就不同构。
      # 版本要求声明在 package.json 的 devEngines.packageManager，npm 自己在
      # install/ci/run 前强制校验；这一步只负责把它装到位。
      # ★ 在 `runner.temp` 里跑：那儿没有 package.json，所以这条命令本身不会去读
      #   仓库的 devEngines（自举时用的还是旧 npm）。
      - name: Match the local npm major
        working-directory: ${{ runner.temp }}
        run: npm i -g npm@12

      - name: Locate the npm cache
        id: npm-cache
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install locked dependencies
        run: npm ci

      - name: Verify reproducible build, quality budgets, and tests
        run: npm run check
