name: LuoguSP CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: luogusp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ★ 必須排在 setup-node 之前：下面那步的 `cache: pnpm` 會去調 pnpm 定位 store，
      #   找不到執行檔就在「Set up Node」當場失敗，後面全被跳過。
      #   版本不寫在這裡 —— action 讀 package.json 的 packageManager 欄位，
      #   與本機、與 pnpm 自身的版本檢核共用同一個來源。
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # `--frozen-lockfile` 是這裡唯一的 lock 一致性判據：pnpm-lock.yaml 與
      # package.json 對不上就直接拒裝。本儲存庫曾經維護兩份 lockfile 並靠
      # scripts/lock-sync.mjs 把「只刷新了 pnpm 那份」搬到本機回報錯誤，
      # 2026-08-17 全量切 pnpm 後單一 lockfile，那道門連同 npm 軌一併撤除。
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify reproducible build, quality budgets, and tests
        run: pnpm check
