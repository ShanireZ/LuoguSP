main:
  push:
    - name: LuoguSP CI
      docker:
        image: node:26.7.0-bookworm
      stages:
        # 这里不能用 pnpm/action-setup（那是 GitHub Actions 专用），所以用镜像自带的
        # npm 装一次 pnpm —— npm 在本仓的用途仅此一项自举，不参与依赖安装。
        # ★ 版本号不写死：从 package.json 的 packageManager 字段取。它是全仓唯一的
        #   pnpm 版本来源（本地、GitHub CI、这里共用），写死会多出一个会漂的副本。
        # ★ corepack 不用管：Node 25 起已不随 Node 分发，这个镜像里根本没有。
        - name: Set up pnpm
          script: npm i -g pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")
        - name: Install locked dependencies
          script: pnpm install --frozen-lockfile
        - name: Verify reproducible build, quality budgets, and tests
          script: pnpm check

  pull_request:
    - name: LuoguSP CI
      docker:
        image: node:26.7.0-bookworm
      stages:
        - name: Set up pnpm
          script: npm i -g pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")
        - name: Install locked dependencies
          script: pnpm install --frozen-lockfile
        - name: Verify reproducible build, quality budgets, and tests
          script: pnpm check
